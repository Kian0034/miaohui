name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-win.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build (PyInstaller onedir)
        shell: pwsh
        run: >
          pyinstaller --noconfirm --clean --windowed --name MiaoHui
          --hidden-import appdirs
          --exclude-module pkg_resources
          --hidden-import core.pipeline
          --hidden-import core.bootstrap
          --hidden-import core.search
          --hidden-import app_win.panel
          --hidden-import app_win.tray
          --hidden-import app_win.hotkey
          --hidden-import app_win.opener
          --hidden-import PySide6
          --hidden-import PySide6.QtCore
          --hidden-import PySide6.QtGui
          --hidden-import PySide6.QtWidgets
          --collect-all PySide6
          --collect-all jieba
          --collect-all rapidocr_onnxruntime
          --collect-all cv2
          --collect-all onnxruntime
          --collect-all hnswlib
          --collect-all ctranslate2
          --collect-all tokenizers
          --collect-all av
          main.py

      - name: Smoke test (UI probe - MUST PASS)
        shell: pwsh
        run: |
          Remove-Item ui_probe_ok.txt -ErrorAction SilentlyContinue
          & .\dist\MiaoHui\MiaoHui.exe --probe-ui
          Start-Sleep -Seconds 3
          if (Test-Path ui_probe_ok.txt) {
            Write-Host "SMOKE PASSED (marker file found)"
          } else {
            Write-Host "SMOKE FAILED (no marker file)"
            exit 1
          }

      - name: Assemble package
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse -Force dist\MiaoHui package\MiaoHui
          if (Test-Path scripts\win\启动秒回.bat) { Copy-Item -Force scripts\win\启动秒回.bat package\ }
          if (Test-Path 使用说明.txt) { Copy-Item -Force 使用说明.txt package\ }
          $expected = Get-ChildItem package\MiaoHui -Recurse -File | Measure-Object -Property Length -Sum
          Write-Host "Build size: $($expected.Sum / 1MB) MB"
          if ($expected.Sum -lt 50MB) { Write-Host "BUILD TOO SMALL, likely missing dependencies"; exit 1 }
          Compress-Archive -Path package\* -DestinationPath MiaoHui-Windows.zip -Force
          Get-ChildItem MiaoHui-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MiaoHui-Windows
          path: MiaoHui-Windows.zip
          retention-days: 30
